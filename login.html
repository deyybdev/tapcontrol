<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" type="image/png" href="frontend/img/favicon.png"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background: #0a1628;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Background blobs */
    body::before {
      content: '';
      position: fixed;
      top: -120px; left: -120px;
      width: 480px; height: 480px;
      background: radial-gradient(circle, rgba(29,158,117,0.18) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -100px; right: -80px;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(59,79,228,0.15) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .login-card {
      background: #fff;
      border-radius: 20px;
      padding: 44px 40px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.35);
      animation: fadeUp 0.4s ease both;
      position: relative;
      z-index: 1;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Brand */
    .login-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .login-brand svg { flex-shrink: 0; }
    .login-brand-name {
      font-size: 1.35rem;
      font-weight: 700;
      color: #0a1628;
      letter-spacing: -0.3px;
    }

    .login-title {
      font-size: 1.45rem;
      font-weight: 700;
      color: #0a1628;
      margin-bottom: 4px;
    }
    .login-sub {
      font-size: 0.82rem;
      color: #888;
      margin-bottom: 28px;
    }

    /* Form */
    .form-group { margin-bottom: 16px; }
    .form-label-custom {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-wrap {
      position: relative;
    }
    .input-wrap i {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: #aaa;
      font-size: 1rem;
      pointer-events: none;
    }
    .input-wrap input {
      width: 100%;
      padding: 11px 14px 11px 38px;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.88rem;
      color: #1a1a2e;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #fafafa;
    }
    .input-wrap input:focus {
      border-color: #1D9E75;
      box-shadow: 0 0 0 3px rgba(29,158,117,0.12);
      background: #fff;
    }
    .input-wrap input.error {
      border-color: #e74c3c;
      box-shadow: 0 0 0 3px rgba(231,76,60,0.1);
    }
    /* Toggle password visibility */
    .input-wrap .toggle-pw {
      position: absolute;
      right: 13px;
      left: auto;
      top: 50%;
      transform: translateY(-50%);
      color: #aaa;
      cursor: pointer;
      font-size: 1rem;
      pointer-events: all;
      z-index: 2;
    }
    .input-wrap .toggle-pw:hover { color: #555; }
    .input-wrap input.has-toggle { padding-right: 38px; }

    .error-msg {
      font-size: 0.75rem;
      color: #e74c3c;
      margin-top: 5px;
      display: none;
    }
    .error-msg.show { display: block; }

    .btn-signin {
      width: 100%;
      padding: 12px;
      background: #042C53;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-signin:hover  { background: #063a6e; }
    .btn-signin:active { transform: scale(0.98); }
    .btn-signin:disabled { background: #aaa; cursor: not-allowed; }

    .login-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.75rem;
      color: #bbb;
    }

    /* Alert for wrong credentials */
    .alert-error {
      background: #fff5f5;
      border: 1px solid #fecaca;
      color: #c0392b;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      display: none;
    }
    .alert-error.show { display: flex; }
  </style>
</head>
<body>

<div class="login-card">

  <!-- Brand -->
  <div class="login-brand">
    <svg width="36" height="36" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="32" height="32" rx="8" fill="#042C53"/>
      <path d="M16 5C16 5 9 13.5 9 18.5C9 22.09 12.13 25 16 25C19.87 25 23 22.09 23 18.5C23 13.5 16 5 16 5Z" fill="#1D9E75"/>
      <path d="M16 13C16 13 12.5 17.8 12.5 20.3C12.5 22.07 14.07 23.5 16 23.5C17.93 23.5 19.5 22.07 19.5 20.3C19.5 17.8 16 13 16 13Z" fill="white" fill-opacity="0.25"/>
      <path d="M13 20.5C13 18.8 14.8 16 16 14.5" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    </svg>
    <span class="login-brand-name">TapControl</span>
  </div>

  <div class="login-title">Welcome back</div>
  <div class="login-sub">Sign in to your account to continue</div>

  <!-- Wrong credentials alert -->
  <div class="alert-error" id="alertError">
    <i class="bi bi-exclamation-circle-fill"></i>
    <span id="alertMsg">Invalid username or password.</span>
  </div>

  <!-- Username -->
  <div class="form-group">
    <label class="form-label-custom">Username</label>
    <div class="input-wrap">
      <i class="bi bi-person"></i>
      <input type="text" id="inputUsername" placeholder="Enter your username"
             autocomplete="username" onkeydown="if(event.key==='Enter')tryLogin()"/>
    </div>
    <div class="error-msg" id="errUsername">Username is required.</div>
  </div>

  <!-- Password -->
  <div class="form-group">
    <label class="form-label-custom">Password</label>
    <div class="input-wrap">
      <i class="bi bi-lock"></i>
      <input type="password" id="inputPassword" placeholder="Enter your password"
             class="has-toggle" autocomplete="current-password" onkeydown="if(event.key==='Enter')tryLogin()"/>
      <i class="bi bi-eye toggle-pw" id="togglePw" onclick="togglePassword()"></i>
    </div>
    <div class="error-msg" id="errPassword">Password is required.</div>
  </div>

  <button class="btn-signin" id="btnSignIn" onclick="tryLogin()">
    <i class="bi bi-box-arrow-in-right"></i> Sign In
  </button>

  <div class="login-footer">TapControl &copy; 2025</div>
</div>

<script>
  // ── Accounts ─────────────────────────────────
  // Add more accounts here as needed
  const ACCOUNTS = [
    { username: 'admin',    password: 'admin#2025', name: 'Admin',      role: 'System Administrator' },
    { username: 'superadmin', password: 'super@2025',   name: 'Super Admin', role: 'System Administrator' },
  ];

  // Redirect if already logged in
  if (sessionStorage.getItem('tc_user')) {
    window.location.href = 'frontend/index.html';
  }

  function togglePassword() {
    const inp = document.getElementById('inputPassword');
    const ico = document.getElementById('togglePw');
    const isHidden = inp.type === 'password';
    inp.type = isHidden ? 'text' : 'password';
    ico.className = isHidden ? 'bi bi-eye-slash toggle-pw' : 'bi bi-eye toggle-pw';
  }

  function tryLogin() {
    const username = document.getElementById('inputUsername').value.trim();
    const password = document.getElementById('inputPassword').value;
    const btn      = document.getElementById('btnSignIn');

    // Clear errors
    document.getElementById('errUsername').classList.remove('show');
    document.getElementById('errPassword').classList.remove('show');
    document.getElementById('alertError').classList.remove('show');
    document.getElementById('inputUsername').classList.remove('error');
    document.getElementById('inputPassword').classList.remove('error');

    let valid = true;
    if (!username) {
      document.getElementById('errUsername').classList.add('show');
      document.getElementById('inputUsername').classList.add('error');
      valid = false;
    }
    if (!password) {
      document.getElementById('errPassword').classList.add('show');
      document.getElementById('inputPassword').classList.add('error');
      valid = false;
    }
    if (!valid) return;

    // Match account
    const account = ACCOUNTS.find(a =>
      a.username === username && a.password === password
    );

    if (!account) {
      document.getElementById('alertMsg').textContent = 'Invalid username or password.';
      document.getElementById('alertError').classList.add('show');
      document.getElementById('inputPassword').classList.add('error');
      document.getElementById('inputPassword').value = '';
      document.getElementById('inputPassword').focus();
      return;
    }

    // Save session
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Signing in…';
    sessionStorage.setItem('tc_user', JSON.stringify({ name: account.name, role: account.role, username: account.username }));

    setTimeout(() => {
      window.location.href = 'frontend/index.html';
    }, 600);
  }
</script>
</body>
</html>
