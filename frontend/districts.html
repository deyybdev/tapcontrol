<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Districts</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="css/utilities.css" rel="stylesheet"/>
  <link href="css/layout.css" rel="stylesheet"/>
  <link href="css/components.css" rel="stylesheet"/>
  <script src="js/utils.js"></script>
</head>
<body>

<div class="page-title">Districts</div>

<div class="d-flex justify-content-end mb-3">
  <button class="btn-add" onclick="openModal('addDistrictModal')">
    <i class="bi bi-plus-lg"></i> Add District
  </button>
</div>

<!-- District cards rendered here by districts.js -->
<div class="row g-3" id="districtCards"></div>
<div class="empty-state" id="districtEmpty" style="display:none">
  No districts added yet. Click "Add District" to get started.
</div>

<!-- ── ADD DISTRICT MODAL ── -->
<div class="modal-backdrop-custom" id="addDistrictModal" onclick="closeModalOutside(event,'addDistrictModal')">
  <div class="modal-box">
    <button class="modal-close-btn" onclick="closeModal('addDistrictModal')"><i class="bi bi-x"></i></button>
    <div class="modal-title">Add District</div>
    <div class="modal-sub">Register a new water supply service district.</div>

    <div class="mb-3" id="fg-distName">
      <label class="form-label-custom">District Name</label>
      <input class="form-control-custom" type="text" id="inputDistName" placeholder="e.g. District G — Lakeside"/>
      <div class="form-error-msg">District name is required.</div>
    </div>
    <div class="row g-2 mb-3">
      <div class="col-6" id="fg-distUsage">
        <label class="form-label-custom">Capacity Usage (%)</label>
        <input class="form-control-custom" type="number" min="0" max="100" id="inputDistUsage" placeholder="e.g. 72"/>
        <div class="form-error-msg">Enter a value between 0 and 100.</div>
      </div>
      <div class="col-6" id="fg-distConsumers">
        <label class="form-label-custom">No. of Consumers</label>
        <input class="form-control-custom" type="number" id="inputDistConsumers" placeholder="e.g. 420"/>
        <div class="form-error-msg">Enter a valid number.</div>
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label-custom">Status</label>
      <select class="form-control-custom" id="inputDistStatus">
        <option>Operational</option>
        <option>Near Limit</option>
        <option>Critical</option>
      </select>
    </div>

    <div class="modal-footer-btns">
      <button class="btn-modal-cancel" onclick="closeModal('addDistrictModal')">Cancel</button>
      <button class="btn-modal-save" onclick="saveDistrict()">Save District</button>
    </div>
  </div>
</div>

<!-- ── EDIT DISTRICT MODAL ── -->
<div class="modal-backdrop-custom" id="editDistrictModal" onclick="closeModalOutside(event,'editDistrictModal')">
  <div class="modal-box">
    <button class="modal-close-btn" onclick="closeModal('editDistrictModal')"><i class="bi bi-x"></i></button>
    <div class="modal-title">Edit District</div>
    <div class="modal-sub">Update district details.</div>
    <input type="hidden" id="editDistId"/>

    <div class="mb-3">
      <label class="form-label-custom">District Name</label>
      <input class="form-control-custom" type="text" id="editDistName"/>
    </div>
    <div class="row g-2 mb-3">
      <div class="col-6">
        <label class="form-label-custom">Capacity Usage (%)</label>
        <input class="form-control-custom" type="number" min="0" max="100" id="editDistUsage"/>
      </div>
      <div class="col-6">
        <label class="form-label-custom">No. of Consumers</label>
        <input class="form-control-custom" type="number" id="editDistConsumers"/>
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label-custom">Status</label>
      <select class="form-control-custom" id="editDistStatus">
        <option>Operational</option>
        <option>Near Limit</option>
        <option>Critical</option>
      </select>
    </div>

    <div class="modal-footer-btns">
      <button class="btn-modal-cancel" onclick="closeModal('editDistrictModal')">Cancel</button>
      <button class="btn-modal-save" onclick="updateDistrict()">Update District</button>
    </div>
  </div>
</div>

<!-- ── DELETE DISTRICT MODAL ── -->
<div class="modal-backdrop-custom" id="deleteDistrictModal" onclick="closeModalOutside(event,'deleteDistrictModal')">
  <div class="modal-box" style="max-width:400px; text-align:center">
    <button class="modal-close-btn" onclick="closeModal('deleteDistrictModal')"><i class="bi bi-x"></i></button>
    <div style="font-size:2.5rem; margin-bottom:12px">🗑️</div>
    <div class="modal-title">Delete District?</div>
    <div class="modal-sub" id="deleteDistrictMsg" style="margin-top:6px"></div>
    <div class="modal-footer-btns" style="justify-content:center">
      <button class="btn-modal-cancel" onclick="closeModal('deleteDistrictModal')">Cancel</button>
      <button class="btn-modal-delete" onclick="confirmDeleteDistrict()">Yes, Delete</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/layout.js"></script>
<script src="js/districts.js"></script>
<script>
  renderLayout('districts');
  renderDistricts();
</script>
</body>
</html>
