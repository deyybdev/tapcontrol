<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" type="image/png" href="img/favicon.png"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Service Requests</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="css/utilities.css" rel="stylesheet"/>
  <link href="css/layout.css" rel="stylesheet"/>
  <link href="css/components.css" rel="stylesheet"/>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
</head>
<body>

<div class="page-title">Service Requests</div>

<div class="row g-3 mb-4">
  <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-card-label">Open</div><div class="stat-card-value" id="sr-open">—</div></div></div>
  <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-card-label">In Progress</div><div class="stat-card-value" id="sr-inprogress">—</div></div></div>
  <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-card-label">Resolved</div><div class="stat-card-value" id="sr-resolved">—</div></div></div>
  <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-card-label">High Priority</div><div class="stat-card-value" id="sr-high" style="color:#e74c3c">—</div></div></div>
</div>

<div class="table-card">
  <div class="table-card-header">
    <div class="table-card-title">All Requests</div>
    <div class="filter-bar">
      <input class="filter-input" type="text" id="srSearch" placeholder="Search consumer or type…" oninput="renderRequests()"/>
      <select class="filter-zone" id="srStatusFilter" onchange="renderRequests()">
        <option value="">All Status</option>
        <option>Open</option><option>In Progress</option><option>Resolved</option>
      </select>
      <button class="btn-add" onclick="openModal('addSRModal')">
        <i class="bi bi-plus-lg"></i> New Request
      </button>
    </div>
  </div>
  <div class="table-responsive">
    <table class="table tc-table mb-0">
      <thead>
        <tr><th>#</th><th>Req No.</th><th>Consumer</th><th>Type</th><th>Priority</th><th>Assigned</th><th>Status</th><th>Filed</th><th>Actions</th></tr>
      </thead>
      <tbody id="srTableBody"></tbody>
    </table>
    <div class="empty-state" id="srEmpty" style="display:none">No requests found.</div>
  </div>
</div>

<!-- ADD REQUEST MODAL -->
<div class="modal-backdrop-custom" id="addSRModal" onclick="closeModalOutside(event,'addSRModal')">
  <div class="modal-box">
    <button class="modal-close-btn" onclick="closeModal('addSRModal')"><i class="bi bi-x"></i></button>
    <div class="modal-title">New Service Request</div>
    <div class="modal-sub">File a new service request.</div>

    <!-- Step 1: District -->
    <div class="mb-3" id="fg-srDistrict">
      <label class="form-label-custom">District</label>
      <select class="form-control-custom" id="inputSRDistrict" onchange="onSRDistrictSelect()">
        <option value="">— Select District —</option>
      </select>
      <div class="form-error-msg">Select a district.</div>
    </div>

    <!-- Step 2: Consumer -->
    <div class="mb-3" id="fg-srConsumer">
      <label class="form-label-custom">Consumer</label>
      <select class="form-control-custom" id="inputSRConsumer" disabled>
        <option value="">— Select District First —</option>
      </select>
      <div class="form-error-msg">Select a consumer.</div>
    </div>

    <div class="row g-2 mb-3">
      <div class="col-6">
        <label class="form-label-custom">Request Type</label>
        <select class="form-control-custom" id="inputSRType">
          <option>Leak Report</option>
          <option>New Connection</option>
          <option>Meter Issue</option>
          <option>Pressure Problem</option>
          <option>Other</option>
        </select>
      </div>
      <div class="col-6">
        <label class="form-label-custom">Priority</label>
        <select class="form-control-custom" id="inputSRPriority">
          <option>Low</option>
          <option>Medium</option>
          <option>High</option>
        </select>
      </div>
    </div>

    <!-- Step 3: Assigned To (Technicians from selected district) -->
    <div class="mb-3" id="fg-srAssigned">
      <label class="form-label-custom">Assigned To <span style="color:#aaa;font-size:.75rem">(Technician)</span></label>
      <select class="form-control-custom" id="inputSRAssigned" disabled>
        <option value="">— Select District First —</option>
      </select>
      <div class="form-error-msg">Select a technician.</div>
    </div>

    <div class="modal-footer-btns">
      <button class="btn-modal-cancel" onclick="closeModal('addSRModal')">Cancel</button>
      <button class="btn-modal-save" onclick="saveRequest()">Submit Request</button>
    </div>
  </div>
</div>

<!-- DELETE MODAL -->
<div class="modal-backdrop-custom" id="deleteSRModal" onclick="closeModalOutside(event,'deleteSRModal')">
  <div class="modal-box" style="max-width:400px;text-align:center">
    <button class="modal-close-btn" onclick="closeModal('deleteSRModal')"><i class="bi bi-x"></i></button>
    <div style="font-size:2.5rem;margin-bottom:12px">🗑️</div>
    <div class="modal-title">Delete Request?</div>
    <div class="modal-sub" id="deleteSRMsg" style="margin-top:6px"></div>
    <div class="modal-footer-btns" style="justify-content:center">
      <button class="btn-modal-cancel" onclick="closeModal('deleteSRModal')">Cancel</button>
      <button class="btn-modal-delete" onclick="confirmDeleteSR()">Yes, Delete</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/layout.js"></script>
<script src="js/servicerequest.js"></script>
<script>renderLayout('requests'); renderRequests();</script>
</body>
</html>
