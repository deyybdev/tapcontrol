<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meter Readings</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="css/utilities.css" rel="stylesheet"/>
  <link href="css/layout.css" rel="stylesheet"/>
  <link href="css/components.css" rel="stylesheet"/>
  <script src="js/utils.js"></script>
</head>
<body>

<div class="page-title">Meter Readings</div>

<div class="table-card">
  <div class="table-card-header">
    <div class="table-card-title">Recent Readings — May 2026</div>
    <div class="filter-bar">
      <input class="filter-input" type="text" id="meterSearch" placeholder="Search meter or consumer…" oninput="renderMeters()"/>
      <select class="filter-zone" id="meterDistrictFilter" onchange="renderMeters()">
        <option value="">All Districts</option>
      </select>
      <button class="btn-add" onclick="openModal('addMeterModal')">
        <i class="bi bi-plus-lg"></i> Add Reading
      </button>
    </div>
  </div>
  <div class="table-responsive">
    <table class="table tc-table mb-0">
      <thead>
        <tr><th>#</th><th>Meter No.</th><th>Consumer</th><th>District</th><th>Previous</th><th>Current</th><th>Consumption</th><th>Date</th><th>Reader</th><th>Actions</th></tr>
      </thead>
      <tbody id="meterTableBody"></tbody>
    </table>
    <div class="empty-state" id="meterEmpty" style="display:none">No readings found.</div>
  </div>
</div>

<!-- ADD READING MODAL -->
<div class="modal-backdrop-custom" id="addMeterModal" onclick="closeModalOutside(event,'addMeterModal')">
  <div class="modal-box">
    <button class="modal-close-btn" onclick="closeModal('addMeterModal')"><i class="bi bi-x"></i></button>
    <div class="modal-title">Add Meter Reading</div>
    <div class="modal-sub">Record a new meter reading entry.</div>
    <div class="row g-2 mb-3">
      <div class="col-6" id="fg-consumer">
        <label class="form-label-custom">Consumer</label>
        <select class="form-control-custom" id="inputConsumer" onchange="onConsumerSelect()">
          <option value="">— Select Consumer —</option>
        </select>
        <div class="form-error-msg">Required.</div>
      </div>
      <div class="col-6" id="fg-meterNo">
        <label class="form-label-custom">Meter No.</label>
        <input class="form-control-custom" type="text" id="inputMeterNo" placeholder="Auto-filled" readonly style="background:#f5f5f5; color:#888; cursor:not-allowed;"/>
        <div class="form-error-msg">Select a consumer first.</div>
      </div>
    </div>
    <div class="row g-2 mb-3">
      <div class="col-6">
        <label class="form-label-custom">District</label>
        <select class="form-control-custom" id="inputMeterDistrict">
        </select>
      </div>
      <div class="col-6">
        <label class="form-label-custom">Reader</label>
        <select class="form-control-custom" id="inputReader">
          <option value="">— Select Meter Reader —</option>
        </select>
      </div>
    </div>
    <div class="row g-2 mb-3">
      <div class="col-6" id="fg-prev">
        <label class="form-label-custom">Previous Reading</label>
        <input class="form-control-custom" type="number" id="inputPrev" placeholder="0"/>
        <div class="form-error-msg">Enter a valid number.</div>
      </div>
      <div class="col-6" id="fg-curr">
        <label class="form-label-custom">Current Reading</label>
        <input class="form-control-custom" type="number" id="inputCurr" placeholder="0"/>
        <div class="form-error-msg">Enter a valid number.</div>
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label-custom">Reading Date</label>
      <input class="form-control-custom" type="date" id="inputMeterDate"/>
    </div>
    <div class="modal-footer-btns">
      <button class="btn-modal-cancel" onclick="closeModal('addMeterModal')">Cancel</button>
      <button class="btn-modal-save" onclick="saveMeterReading()">Save Reading</button>
    </div>
  </div>
</div>

<!-- DELETE MODAL -->
<div class="modal-backdrop-custom" id="deleteMeterModal" onclick="closeModalOutside(event,'deleteMeterModal')">
  <div class="modal-box" style="max-width:400px;text-align:center">
    <button class="modal-close-btn" onclick="closeModal('deleteMeterModal')"><i class="bi bi-x"></i></button>
    <div style="font-size:2.5rem;margin-bottom:12px">🗑️</div>
    <div class="modal-title">Delete Reading?</div>
    <div class="modal-sub" id="deleteMeterMsg" style="margin-top:6px"></div>
    <div class="modal-footer-btns" style="justify-content:center">
      <button class="btn-modal-cancel" onclick="closeModal('deleteMeterModal')">Cancel</button>
      <button class="btn-modal-delete" onclick="confirmDeleteMeter()">Yes, Delete</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/layout.js"></script>
<script src="js/meters.js"></script>
<script>
  renderLayout('meters');
  document.getElementById('inputMeterDate').value = new Date().toISOString().slice(0,10);
  renderMeters();
</script>
</body>
</html>
