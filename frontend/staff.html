<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" type="image/png" href="img/favicon.png"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Staff</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="css/utilities.css" rel="stylesheet"/>
  <link href="css/layout.css" rel="stylesheet"/>
  <link href="css/components.css" rel="stylesheet"/>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
</head>
<body>

<div class="page-title">Staff</div>

<div class="table-card">
  <div class="table-card-header">
    <div class="table-card-title">Staff Directory</div>
    <div class="filter-bar">
      <input class="filter-input" type="text" id="staffSearch" placeholder="Search name or role…" oninput="renderStaff()"/>
      <select class="filter-zone" id="staffDistrictFilter" onchange="renderStaff()">
        <option value="">All Districts</option>
      </select>
      <button class="btn-add" onclick="openModal('addStaffModal')">
        <i class="bi bi-plus-lg"></i> Add Staff
      </button>
    </div>
  </div>
  <div class="table-responsive">
    <table class="table tc-table mb-0">
      <thead>
        <tr><th>#</th><th>Staff ID</th><th>Name</th><th>Role</th><th>District</th><th>Contact</th><th>Status</th><th>Date Hired</th><th>Actions</th></tr>
      </thead>
      <tbody id="staffTableBody"></tbody>
    </table>
    <div class="empty-state" id="staffEmpty" style="display:none">No staff records found.</div>
  </div>
</div>

<!-- ADD STAFF MODAL -->
<div class="modal-backdrop-custom" id="addStaffModal" onclick="closeModalOutside(event,'addStaffModal')">
  <div class="modal-box">
    <button class="modal-close-btn" onclick="closeModal('addStaffModal')"><i class="bi bi-x"></i></button>
    <div class="modal-title">Add Staff Member</div>
    <div class="modal-sub">Register a new staff member.</div>
    <div class="mb-3" id="fg-staffName">
      <label class="form-label-custom">Full Name</label>
      <input class="form-control-custom" type="text" id="inputStaffName" placeholder="e.g. Juan Reyes"/>
      <div class="form-error-msg">Required.</div>
    </div>
    <div class="row g-2 mb-3">
      <div class="col-6">
        <label class="form-label-custom">Role</label>
        <select class="form-control-custom" id="inputStaffRole">
          <option>Meter Reader</option><option>Billing Officer</option>
          <option>Technician</option><option>Supervisor</option>
        </select>
      </div>
      <div class="col-6">
        <label class="form-label-custom">District</label>
        <select class="form-control-custom" id="inputStaffDistrict">
          <!-- populated from GET /api/districts -->
        </select>
      </div>
    </div>
    <div class="row g-2 mb-3">
      <div class="col-6">
        <label class="form-label-custom">Contact</label>
        <input class="form-control-custom" type="text" id="inputStaffContact" placeholder="09XX-XXX-XXXX"/>
      </div>
      <div class="col-6">
        <label class="form-label-custom">Status</label>
        <select class="form-control-custom" id="inputStaffStatus">
          <option>Active</option><option>On Leave</option><option>Inactive</option>
        </select>
      </div>
    </div>
    <div class="modal-footer-btns">
      <button class="btn-modal-cancel" onclick="closeModal('addStaffModal')">Cancel</button>
      <button class="btn-modal-save" onclick="saveStaff()">Save Staff</button>
    </div>
  </div>
</div>

<!-- EDIT STAFF MODAL -->
<div class="modal-backdrop-custom" id="editStaffModal" onclick="closeModalOutside(event,'editStaffModal')">
  <div class="modal-box">
    <button class="modal-close-btn" onclick="closeModal('editStaffModal')"><i class="bi bi-x"></i></button>
    <div class="modal-title">Edit Staff Member</div>
    <div class="modal-sub">Update staff details.</div>
    <input type="hidden" id="editStaffId"/>
    <div class="mb-3">
      <label class="form-label-custom">Full Name</label>
      <input class="form-control-custom" type="text" id="editStaffName"/>
    </div>
    <div class="row g-2 mb-3">
      <div class="col-6">
        <label class="form-label-custom">Role</label>
        <select class="form-control-custom" id="editStaffRole">
          <option>Meter Reader</option><option>Billing Officer</option>
          <option>Technician</option><option>Supervisor</option>
        </select>
      </div>
      <div class="col-6">
        <label class="form-label-custom">District</label>
        <select class="form-control-custom" id="editStaffDistrict">
        </select>
      </div>
    </div>
    <div class="row g-2 mb-3">
      <div class="col-6">
        <label class="form-label-custom">Contact</label>
        <input class="form-control-custom" type="text" id="editStaffContact"/>
      </div>
      <div class="col-6">
        <label class="form-label-custom">Status</label>
        <select class="form-control-custom" id="editStaffStatus">
          <option>Active</option><option>On Leave</option><option>Inactive</option>
        </select>
      </div>
    </div>
    <div class="modal-footer-btns">
      <button class="btn-modal-cancel" onclick="closeModal('editStaffModal')">Cancel</button>
      <button class="btn-modal-save" onclick="updateStaff()">Update Staff</button>
    </div>
  </div>
</div>

<!-- DELETE MODAL -->
<div class="modal-backdrop-custom" id="deleteStaffModal" onclick="closeModalOutside(event,'deleteStaffModal')">
  <div class="modal-box" style="max-width:400px;text-align:center">
    <button class="modal-close-btn" onclick="closeModal('deleteStaffModal')"><i class="bi bi-x"></i></button>
    <div style="font-size:2.5rem;margin-bottom:12px">🗑️</div>
    <div class="modal-title">Remove Staff?</div>
    <div class="modal-sub" id="deleteStaffMsg" style="margin-top:6px"></div>
    <div class="modal-footer-btns" style="justify-content:center">
      <button class="btn-modal-cancel" onclick="closeModal('deleteStaffModal')">Cancel</button>
      <button class="btn-modal-delete" onclick="confirmDeleteStaff()">Yes, Remove</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/layout.js"></script>
<script src="js/staff.js"></script>
<script>renderLayout('staff'); renderStaff();</script>
</body>
</html>
